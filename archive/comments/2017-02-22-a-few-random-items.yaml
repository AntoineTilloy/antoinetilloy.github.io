  content: 'I''ve looked at that article, and it sounds like you''re trying to escape the fact that matter is made of particles in space-time, the same particles that make up states in Hilbert Space. The big question, how can it be both, has to be answered. Some kind of product space, perhaps?


    And also if a statistic is a beable, it has to take the form of (or at least supervene on) something classically frequentative. It certainly can''t be Schwartz-valued -- which doesn''t make sense for a beable anyway.


    And you criticize people looking for evidence of collapse for not using a fully relativistic model? It may be possible to start out with Lorenz invariance and come up with something that can be called "collapse" for want of a better word. But if you''re asking how a state actually *becomes* a measured result -- as would be expected from a philosophy of not forbidding questions -- you''re already talking about something frame-dependent.

    '
