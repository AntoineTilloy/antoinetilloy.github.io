  date: '2017-05-22 16:09:00'
  content: "Oui, oui évidemment, tu as raison de préciser. Le minimalisme éthique n'est pas aussi naïf que ce que cette formulation pourrait laisser penser.  \nJ'ai traduit \"ne pas nuire\" en \"do no harm\" pour le rappel du serment d'Hippocrate mais le sens de \"harm\" est évidemment bien plus large que son sens étroit de souffrance physique (la notice Wikipedia en anglais sur Ogien fait la même traduction).\n"
