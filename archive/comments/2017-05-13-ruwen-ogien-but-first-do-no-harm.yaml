  content: "Oui, j'ai vu que Wikipédia donnait la même traduction (il semble que ce soit la traduction canonique, sans doute pour se placer dans la lignée de Mill).  \nEn tout cas j'ai été agréablement surpris de constater qu'Ogien est plus connu que je ne le croyais, je suis tombé par hasard dans une librairie sur la version espagnole de l'Influence de l'odeur des croissants chauds... !\n"
