  content: "J'ai appris cette triste nouvelle il y a quelques jours, et j'ai alors soupçonné que tu l'évoquerais (comme tu le sais, c'est par toi que je l'ai connu).  \nSur le fond, il est peut-être pertinent de souligner la légère différence entre l'anglais \"do not harm\" et le français \"ne pas nuire\". Il me semble que la version française rend la théorie moins naïve que la seule recherche de l'évitement de la souffrance (physique et immédiate) chez autrui (ce qui serait une éthique vraiment trop minimale !). Ainsi, il est clair que même dans l'éthique minimale d'Ogien, il existe une dimension politique, une dimension économique, voire une dimension humaniste.\n"
