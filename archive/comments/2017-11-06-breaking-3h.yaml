  date: '2017-11-07 14:11:35'
  content: 'Le collapse dans la terra incognita n''est pas du tout inévitable. Dans mon cas il vient clairement d''une gestion de course un peu ambitieuse. Ceci dit on peut légitimement se demander s''il y a un moyen de se préparer aux derniers kilomètres où le corps est dans un état de fatigue extrême sans se détruire.


    Les entrainements de plus de 2h - 2h15 ont des bénéfices limités car on met beaucoup de temps à récupérer et ils sont aussi dangereux pour les articulations. Ce dernier problème peut être contourné : une stratégie est de faire 2h de vélo ou d''elliptique, puis de partir pour un entraînement de course à pied de 1h dans cet état de préfatigue (musculaire mais pas articulaire). On a moins de risque de se faire mal, mais il n''est toujours pas clair que l''on récupère à temps pour les entraînements suivants. Je crois que le consensus est que des sorties longues de durée "normale", c''est à dire autour de 2h, font plus ou moins maximalement progresser sur les derniers kilomètres du marathon même si leur durée est plus courte. Les sensations le jour J seront différentes mais la préparation aura été optimale. Pour avoir une idée des sensations, effectivement les seuls entraînements véritables sont les marathons passés. Il faut peut-être préciser enfin que le problème est encore plus marqué
    pour les débutants (disons en + de 4h) qui dépasseront rarement (ou jamais) 20km à l''entraînement. A l''inverse, les coureurs des hauts plateaux ne se posent pas ce genre de question car ils peuvent faire des sorties longues de 35-40 km en 2h15 ou moins (le tout avec variations d''allure !).

    '
