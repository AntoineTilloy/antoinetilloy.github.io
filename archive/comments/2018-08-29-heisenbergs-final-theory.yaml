  date: '2020-04-02 05:19:57'
  content: 'My name is Friedwardt Winterberg, I am almost 91 years old, but the sensational book by Alexander Blum on Heisenberg''s "Weltformel" is a cheap shot. Both Einstein and Heisenberg failed in their attempt to find the "Weltformel" Einstein with the general theory of relativity, and Heisenberg with quantum theory. Much more recently Eduard Witten tried it with the untested string theory in 11 dimensions. Einstein said "God is subtle but not malicious" which I think a God would be with 11 dimensions. Einstein''s and Heisenberg''s failure having nothing to do with old age. As a PhD student of Heisenberg in 1955, I was a witness of his remarkable work. Freeman Dyson with his never observed Dyson spheres is a bad critic. It was Kurt Symanzik with his extraordinary mathematical ability who convinced me that Heisenberg''s theory would not work, at least in the form suggested by Heisenberg. Because of it I got interested in the general theory of relativity, laying the foundation of the
    GPS by proposing to put atomic clocks on artificial satellites. With a accuracy of one part in 10^10 realized in the GPS, general relativity is better than even quantum mechanics where the measured accuracy of the anomalous magnetic moment of the electron has been one part of 10^8.

    '
