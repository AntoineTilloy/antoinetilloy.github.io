  content: 'Hi Antoine, thanks for this nice overview of interesting articles and, of course, for including my article among them. I''m really flattered and I think you summarized my main point very well. I am not dead set against a field ontology (though I admit that the title of my paper seems to suggest just that). However, in a field theory, more or less the same problems arise once you have two types of fields (e.g. fermionic and bosonic) - one that is supposed to represent matter and one that mediates interactions. My message in this case would thus be to try to make do with one field (or one type of field) only and your recent work actually seems to go very much in that direction.


    I hadn''t yet made the connection between the rejection of the initial value dogma and teleological concepts, I was rather thinking in a "global", four-dimensional picture, as you then explain. Still, it might be interesting to explore that connection, so thanks for the suggestion.

    '
