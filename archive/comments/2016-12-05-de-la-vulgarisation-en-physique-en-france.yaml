  content: "Merci pour ce billet. J'avais été voir en mai 2015 une conférence avec ce fameux Étienne Klein et Gérard Berry sur le sujet de la vulgarisation. Ne connaissant pas grand chose à la physique – un peu plus à l'informatique – et étant confonté à ce problème (je fais un doctorat et doit souvent expliquer mon sujet le plus simplement possible), je les avais trouvé tout deux très bons.\n\nLeur argument, surtout développé par G. Berry qui est un très bon vulgarisateur amha, était de redonner vie à un format médiatique : la \"leçon de choses\". On se cantonne à un sujet, on prend un exemple et on en donne une image la plus simple et la plus exacte possible, ou tout du moins on explicite les limites de l'image qu'on utilise. Berry est spécialiste en algorithmique, du coup il expliquait simplement comment trier une liste de nombres en ordre croissant par le moins d'opérations possibles, comment trier les pairs des impairs etc. Lui s'appuyait sur son expérience de grand-père : comment expliquer\
    \ à ma petite-fille de 8 ans ce que je fais ?\n\nCe qui amène deux réflexions pour prolonger l'article :  \n- Peut être qu'il faut aussi s'interroger sur le format médiatique adopté : livre, conférences TedX, article de presse, radio... Les attendus sont un peu différents selon les formats, et peut être que certaine (la fameuse \"leçon de choses\") permettent d'éviter les écueils des exemples ci-dessus.  \n- Il faut aussi se garder je pense (c'est peut être corrollaire à l'hybris), d'infantiliser son public et d'en passer par des images simplistes. Cela peut être assez contreproductif, même si difficile quand on est mis en position de \"sachant\" qui doit apprendre à des béotiens (ce terme même étant problématique).\n"
