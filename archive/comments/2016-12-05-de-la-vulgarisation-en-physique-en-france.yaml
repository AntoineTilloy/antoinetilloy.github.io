  content: 'Merci pour ce long commentaire dont il ne faut pas s''excuser et dont je partage le sentiment général. Il n''est probablement ni possible ni souhaitable d''épurer la vulgarisation de son côté spectacle, mais on peut souhaiter qu''elle ne s''y réduise pas.


    Rendre les mathématiques plus populaires est important mais je ne suis pas sûr que ce soit un prérequis pour la vulgarisation en physique. Il faut peut-être distinguer les cours introductifs, pour lesquels on doit certainement présenter les mathématiques, et la vulgarisation, qui s''adresse à un public qui ne souhaite pas devenir physicien professionnel et ne s''intéresse pas aux calculs. Évidemment, celui qui vulgarise a appris les théories de manière fortement mathématisée : c''est normal car on imagine que son expertise va a priori jusqu''à savoir faire les calculs. Mais on peut imaginer que le public n''en a pas besoin. La question est en effet de savoir si les concepts eux mêmes, ceux qui intéressent le public, peuvent raisonnablement être présentés en langage courant sans introduire les niveaux d''abstraction que l''on utilise pour extraire de la théorie des résultats. Par exemple, la relativité restreinte est généralement enseignée de manière assez abstraite, notamment parce que
    ça fait gagner beaucoup de temps avec des élèves qui sont déjà à l''aise en mathématiques. Néanmoins, rien n''empêche de vulgariser la relativité restreinte avec très peu de mathématiques (en tout cas peu d''algèbre et en se restreignant à de la géométrie élémentaire) sans en altérer la substance. Ça n''est pas toujours aussi simple et l''impossibilité (ou l''extrême difficulté) de vulgariser la mécanique quantique sans équations est probablement en partie ce qui fait que l''on raconte beaucoup de bêtises.

    '
