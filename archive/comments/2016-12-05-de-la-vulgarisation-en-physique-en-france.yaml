  content: 'Cécile Michaut, cette critique est légitime et je pèche certainement par absolutisme. Je suis évidemment d''accord avec le fait qu''intéresser au sujet est un préalable. J''ai insisté sur d''autres points, tenant pour acquis le fait que les gens qui s''intéressent à la vulgarisation sont de toute façon des passionnés qui vont chercher à faire vibrer leur public (mais j''admets que j''aurais pu insister). Pour ma défense, j''ai à l''esprit des sujets comme la relativité ou la mécanique quantique (mais aussi la théorie du chaos ou certains aspects de physique statistique) où beaucoup de bêtises circulent à cause du goût pour les phrases qui claquent. C''est ce qui me biaise dans cette critique de la vulgarisation comme tour de magie. On a évidemment le droit de tordre un peu les faits pour rendre la présentation plus agréable, mais il faut tout de même veiller à ce que son auditoire ne puisse pas en retenir des affirmations totalement erronées. Enfin je ne veux décourager personne
    bien au contraire. Quand bien même les critères que j''ai tenté de présenter auraient une quelconque puissance normative, on peut très bien commencer en faisant un peu n''importe quoi.


    Lê, je suis tout à fait d''accord. Mon point sur la légitimité est justement qu''il n''est pas utile de chercher à s''appuyer dessus. Pour la partie sur le h-index et les métriques usuelles, je pensais plutôt aux médias qui sont contraints de filtrer les gens à qui ils donnent la parole. Il faut voir ça comme des critères suffisants mais pas nécessaires. Si le bon vulgarisateur n''est pas un chercheur actif, alors, éventuellement, on peut vérifier qu''il est crédible en demandant leur avis à des chercheurs actifs du domaine (qui eux ne souhaitent pas forcément passer du temps à vulgariser eux même). J''essayais de définir un filtre à vulgarisateur type "Idriss Aberkane" : un type qui parle super bien, adoré des médias, mais qui brasse du vide.

    '
