  content: 'Merci pour ses réflexions très intéressantes. Je partage un dégoût pour les envolées lyriques avec des airs littéraires et philosophiques qui noient la clarté des explications (oulà j''ai même du mal avec la phrase que je viens d''écrire).


    Je mettrais un petit bémol toutefois sur l''importance que tu as attachée à la légitimité. Il me semble que le h-index, ou toute autre mesure de la qualité de la personne en tant que chercheur, n''est pas vraiment prédictif de la qualité de la vulgarisation. J''en veux pour preuve les deux exemples de "bonne vulgarisation" que tu as cités : malgré toute l''admiration que j''ai pour eux, David Louapre et El Jj ne sont pas des chercheurs mondialement reconnus. De même, dire que Klein ou deGrasse Tyson sont mauvais vulgarisateurs car il n''a rien publié de majeur au cours des 20 dernières années est, imho, un argument fallacieux. Pire, je crains que ça ne démotive des jeunes (ou plus vieux) vulgarisateurs qui n''ont pas (encore) publié dans Nature et Science.


    Je pense au contraire qu''il est très possible de faire de l''excellente vulgarisation avec un CV limité, voire avec des connaissances incomplètes. J''en veux pour preuve le monstrueux Michael Stevens qui tient en haleine des millions de spectateurs pendant 25 minutes avec une excellente explication du paradoxe de Banach-Tarski, malgré un background en psychologie et en littérature (et l''absence d''études en "sciences dures") : https://www.youtube.com/watch?v=s86-Z-CbaHA


    Il ne s''agit là que d''un exemple parmi tant d''autres. En fait, rares sont les grandes chaînes YouTube qui sont tenues par des chercheurs de premier rang (en vrac, e.g. 3Blue1Brown Looking Glass Universe, Veritasium, Physics Girl, Singing Banana, SmarterEveryday, ViHart, MinutePhysics, MicMaths...). Ça ne fait absolument pas d''elles de mauvaises vulgarisations, ou de la vulgarisation illégitime. Ce qui importe, je pense, c''est la clarté des propos, l''absence de bullshitage délibéré et une invitation récurrente à aller plus loin que le contenu vulgarisé.


    Ceci dit, je suis globalement d''accord avec tes propos. Surtout la conclusion : "Les chercheurs, jeunes et vieux, ont leur responsabilité dans le manque cruel de matériel de bonne qualité qui pousse les gens à lire les idiots en combinaisons argentées."


    My 2 cents.

    '
