  content: "Bonjour,  \nJe suis d'accord avec la plupart de ce qui a été dit.  \nEn partie pour combler ce manque, j'ai moi aussi essayé d'écrire un peu de vulgarisation pour la physique fondamentale (http://www.godeffroy.fr/physique/). Pour la mécanique quantique, j'ai pour le moment échoué à exprimer la théorie sans formules de maths, mais j'espère un jour trouver une formulation avec moins de \"romantisme\" que ce qu'on a pour le moment.\n\nÇa m'a aussi permis de me rendre compte que la physique fondamentale n'est pas forcément ce dont les gens ont le plus besoin. Pour un néophyte qui a du temps devant lui, ça peut être un hobbie sympathique, mais c'est difficilement utile directement. Expliquer le fonctionnement général de tel ou tel appareil courant est peut-être plus accrocheur, et celui qui veut avoir plus de détails est peut-être alors plus intéressé par les fondamentaux ?\n"
