  content: "Salut Antoine,  \nJ'ai feuilleté ta thèse, le passage sur la théorie dBB à la fin. (Théorie de la mesure en physique quantique, c'est bien ça ?)  \nDu coup je suis amusé de te retrouver ici, sur des thèmes un peu similaires ? Le chapitre que j'ai lu dans ta thèse semblait partager ce \"courroux\" des mystificateurs de la physique quantique.  \nJ'aime beaucoup dans ce billet le passage sur le fait qu'on ne doit pas mystifier l'audience, mais lui donner les moyens de comprendre précisément. C'est précisément ce que j'essaye de faire cette année avec un cours de maths destiné à des étudiants en philo. Je leur ai démystifié 'i', la dénombrabilité de Q et pas de R etc... C'est excellent ! Mais du coup je dois moi-même faire attention à ces écueils que tu décris.\n\nD'ailleurs, le livre sur lequel je me base, \"qu'est-ce que les mathématiques - Courant et Robbins\" est truffé de passages qui insistent sur le fait qu'on devrait sans doutes renoncer à comprendre les choses ontologiquement,\
