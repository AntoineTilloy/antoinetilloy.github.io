  content: "Merci pour ce billet que je partage en grande partie.\n\nJe ne suis pas par principe opposé aux \"envolées littéraires\" de E.Klein ou A.Barrau, je leur reconnais même parfois des formulations assez pertinentes.\n\nMais il y a une chose qui me gène par contre énormément chez la plupart des vulgarisateurs, c’est le cas précis de la physique quantique. Il me semble qu'un vulgarisateur honnête se devrait de dire simplement que cette mécanique est régie par des équations surprenantes, qui fonctionne efficacement mais qui restent interprétables de nombreuses façons.  \nAu lieu de ça, tous les vulgarisateurs préfèrent se vautrer dans la \"facilité\" en présentant un truc hyper mystérieux avec des comparaisons débiles (\"c'est comme si on roulait à 20km/h et en même temps à 80 km/h, etc...\"). Quand ils font cela, les \"vulgarisateurs\" ne cherchent plus à expliquer la physique quantique, ils veulent juste la rendre spectaculaire et énigmatique. Et je pense qu'ils ont alors une grande\
    \ part de responsabilité dans toutes les dérives new-age qui qui ne cessent de réinterpréter la physique quantique pour lui faire dire n'importe quoi.\n"
