  content: 'Je trouve que ces recommandations ne concernent qu''une toute petite partie de la vulgarisation de la physique : celle de haut niveau, s''adressant à des gens cultivés (comme ceux de l''ENS Ulm cités mentionnés par l''auteur), qui prennent plusieurs heures pour comprendre, via une série de conférences ou un livre. Et dans ce cas, peut-être que ces recommandations sont en effet utiles (quoi qu''elles semblent tellement exigeantes qu''elles risques de décourager plus d''un aspirant vulgarisateur).


    Mais si on veut toucher vraiment le grand public, il faut faire une vulgarisation de moins haut niveau, s''adresser à des gens qui ne sont pas spécialement intéressés par la physique, qui n''ont pas beaucoup de temps... Et là, le problème principal n''est ni la légitimité, ni le risque d''en mettre plein la vue, ni l''erreur... c''est tout simplement de ne pas les intéresser, de les perdre ou de les ennuyer. Ces gens continueront à se dire "la physique, ce n''est pas pour moi". Et ça, c''est pire que tout.


    Alors oui, il faut expliquer au mieux, mais avant tout, il faut accrocher le public, lui montrer que la science est passionnante. Et s''il faut pour cela user de métaphore, de poésie, d''humour, bref "en mettre plein la vue", ce n''est pas grave du tout. Tant que le vulgarisateur est honnête et connaît son sujet, tout va bien.


    Pour les vulgarisateurs, je n''ai qu''un conseil : lancez-vous, quitte à faire des erreurs (vous les corrigerez après). Soyez enthousiastes, c''est communicatif.

    '
