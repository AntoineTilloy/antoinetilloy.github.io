  content: 'Comme l''article est un peu provocateur je m''expose à ce genre de réponse. C''est de bonne guerre.


    Il me semble qu''énervé (peut-être à juste titre) par un des points du billet, tu as fait une lecture un peu rapide du reste. Je n''ai jamais mélangé charlatans et littéraires (les charlatans que je mentionne sont d''ailleurs des "scientifiques"). Je critique, peut-être de manière trop grossière, une forme de vulgarisation où le style est vu comme unique substitut aux explications. J''ai l''impression que tu as pris ça pour une attaque contre les littéraires (ce que suggère le "vos cours de physique"), mais il ne faut pas lire plus que ce qui est écrit.


    La phrase que tu cites "les français ont une culture scientifique désastreuse" est volontairement caricaturale, mais elle n''a de sens que dans le paragraphe qui la suit et qui est la conclusion de l''article. Enfin je sais bien que plein d''autres gens y réfléchissent, que ce que je raconte est peut-être très banal, mais bon, tu lis un billet sur mon blog personnel, pas dans une revue spécialisée. Quant aux "vrais" enjeux que tu mentionnes, je ne peux qu''approuver, mais je suis limité. J''imagine que tu y as toi même beaucoup réfléchi et je serais heureux d''en profiter, si possible avec moins d''ironie acide.

