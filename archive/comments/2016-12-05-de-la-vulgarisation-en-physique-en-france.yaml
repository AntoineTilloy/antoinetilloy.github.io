  content: "Je découvre le blog avec cet article très bien écrit. Le problème de la vulgarisation commence à m'intéresser car je suis dans la période de transition entre passionné friand de vulgarisation (les confs de Klein sont pour la plupart très sympa pour un curieux), et étudiant en physique qui commence à comprendre comment la physique moderne fonctionne (niveau fin de licence). Et plus ça va, moins je trouve la vulgarisation séduisante. Plus je suis capable de distinguer les raccourcis et métaphores douteuses, moins je suis prêt à faire confiance à la personne que j'écoute. Non pas qu'elle soit incompétente dans son domaine, je suis encore loin d'avoir le niveau pour en juger, mais travailler les maths et la physique permet de développer ses propres outils de critique et de compréhension et plus on progresse, moins on accepte qu'un autre nous explique d'une manière \"vague\" ce qu'on pourrait sûrement comprendre d'une manière précise, avec un bouquin, un stylo et une feuille de papier\
    \ (et un peu de temps). Et par ce sentiment, j'ai réalisé à quel point on est vulnérable au discours d'un autre sans ces outils, si long à appréhender. Vulnérabilité que l'on vit comme un confortable émerveillement à écouter toutes ses choses qui paraissent incroyable, si on franchit jamais le cap de se mettre au travail. Et c'est là pour moi que le problème commence. Quel est le but de la vulgarisation? Qu’appelle-t-on la culture scientifique ?  \nÉcouter des scientifiques parler de trou noir, de trou de ver, de la théorie des corde, d’énergie et de matière noire, etc. Comme la plupart le font lors de leurs conférences et vidéos, est-ce apprendre ? Est-ce développer sa culture scientifique ? Je commence sérieusement à en douter, et à penser qu’il ne s’agit juste que d’un divertissement pour une audience friande de mystère et d’émerveillement, mais assez récalcitrante à vraiment voir la réalité de la science. Des maths, des modèles statistiques, des choses loin d’être sexy et qui pourtant\
    \ sont cœur de notre culture. Pourquoi ces choses là ne nous paraissent pas attirante ? Question complexe, qui ferait intervenir une critique du modèle d’éducation, des méthodes employées, et encore beaucoup de choses qui me dépassent…\n\nEn prenant la vulgarisation scientifique actuelle pour un divertissement, on comprend que l’on peut être méfiants vis à vis des « vulgarisateurs ». Une personne qui veut divertir les gens, c’est une personne qui avant tout veut se mettre devant une audience et faire le spectacle. Je me dirige peut-être vers un hors sujet ici, du coup je vais aller directement au but. Ce qui me dérange au final chez beaucoup de vulgarisateurs, c’est leur besoin évident de satisfaire un énorme ego en utilisant l’audience, en utilisant le cliché du « génie » (très bien décrit dans l’article). Et ce qui rend ScienceEtonnante si plaisant à regarder (et d’autre chaîne comme Heu?reka), c’est la proximité qu’on a avec la personne via la vidéo dans un format vlog, où on a l’impression\
    \ qu’on essai de nous expliquer quelque chose et non de nous prouver quelque chose. Regarder un Sean Carrol lors d’une conférence ou d’une émission, on a juste l’impression de voir une personne essayant de toutes ses forces de devenir le nouveau R.Feynman (donc de satisfaire ses propres besoin à lui). Un dernier exemple est E-penser, qui après un départ incroyable (en terme de popularité), a perdu tout intérêt quand la chaîne est juste devenu un moyen de satisfaire l’ego de Bruce (qui aurait mieux fait d’aller réviser ses cours pour proposer du contenu qui tiens la route).\n\nDu coup la culture scientifique pour quoi faire ? Si il n’y a aucune ouverture d’esprit sur ce qui la compose par la suite ? La dédiabolisation des mathématiques me paraît une étape primordial pour essayer d’expliquer les différentes théories de la physique à des gens qui s’y intéressent.\n\nWouahou, je ne me suis pas rendu compte d'avoir écrit autant. Désolé pour le long commentaire, je devrai peut-être ouvrir\
    \ un blog. Je vais attendre d'avoir au moins mon master histoire d'être crédible :)\n"
