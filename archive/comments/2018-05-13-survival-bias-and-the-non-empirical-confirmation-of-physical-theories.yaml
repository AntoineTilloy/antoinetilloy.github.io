  content: "In my opinion, the notion “confirmation” is either too strong or not appropriate. It would be better to call the project “non-empirical criteria” or “non-empirical qualities” of a physical theory or “non-empirical corroboration” to make the connection with Popper. No one would disagree that there are theoretical features in favor of a theory apart from its empirical adequacy.\n\nI’m not sure whether Dawid’s principles are the best principles. As you explain, the No Alternative Argument is not correct. The Meta-Inductive Argument needs also be taken with a grain of salt. For this would amount to motivating future quantum theories not to solve the measurement problem since standard QM is so successful. This principle would also have prevented Boltzmann to develop statistical mechanics, because alternative approaches, like energetics, relied on positivism which was supported by thermodynamics. The third principle (Unexpected Explanatory Interconnections) seems ok and is connected\
    \ to unification. Successful theories fulfill this principle.\n\nElegance, beauty, gut feeling, and mathematical fertility (whatever that means) may guide physicists to invent new theories but they are too fuzzy and subjective to prefer one theory over another. I myself lack any sense of mathematical or physical elegance and beauty. I find a tuxedo elegant and a Palladio villa beautiful, but I don’t have this aesthetic experience with an equation.\n\nI would ask the following questions to evaluate a theory:  \n1. What is the ontology?  \n2. How does this ontology explain (observable) phenomena?  \n3. Do these explanations need fine-tuning?  \n4. Is the theory consistent? (cf. self-interaction problem)\n"
