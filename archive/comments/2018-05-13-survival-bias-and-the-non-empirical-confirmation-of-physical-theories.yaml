  content: "If a theory is just empirically adequate and violates the criteria I mentioned, I wouldn’t call this a theory in the first place. It may be a recipe, an algorithm, or a framework, but not a theory. On the other hand, a theory that doesn’t make empirical predictions but that may fulfill some non-empirical criteria is not a physical theory either; it’s rather a piece of mathematics, which may provide some deep mathematical insights, though.\n\nOf course, it takes time to fully develop a theory as it takes time to build a house. When thermodynamics was developed in the 19th century, positivists, like Mach, Ostwald, Mayer, the young Planck, and many others, were opposing Boltzmann who wanted to provide an ontology with his particles and in doing so to explain the second law. They acknowledged that thermodynamics was a kind for framework and agreed with Boltzmann to complete the theory. They disagreed, however, that particles can do the job because particles are unobservable. So they\
    \ tried to replace Boltzmann’s particles by energy; energy was the stuff everything was supposed to be made of, and energy is measurable. We know how this story ended.  \nSomething similar we can see in current physics, with the difference that modern positivists don’t see the need for any completion or for any kind of ontology. I think that’s fine as long as you focus on applying the theory and acknowledge that the theory is still incomplete.\n\nI would say that an ontology is needed for any kind of physical theory, fundamental and non-fundamental. The ontology just answers the question, “What is there?” And someone who does solid state physics or hydrodynamics must say what is there, too. Even if what there is may not be the final answer, these unobservable objects explain. They explain the second law of thermodynamics, they explain the periodic table, they explain the Born rule, they explain why measurement devices behave the way they behave, etc. One may be sceptical that these unobservable\
    \ objects are the real building blocks of nature; this would be the anti-realist position. But one cannot deny that there are these microscopic building blocks out there in nature or that a physical theory is complete without an ontology; this would result in idealism or an extreme form of operationalism.\n\nI doubt that an extreme operationalist can really do all branches of physics. What would be such an operational cosmology? Or such an operational statistical mechanics? Wouldn’t it be against the spirit of such an attitude to judge the theory with respect to non-empirical criteria? It seems, though, that Dawid's criteria would be applicable also for extreme-operational theories: the first two principles compare theories, and the third one focuses on predictions. What's lacking in his criteria is how theories explain, and an ontology can explain a lot.\n"
