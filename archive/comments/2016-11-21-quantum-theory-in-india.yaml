  content: 'Les photos accentuent peut-être un peu le côté "désert" car elles ont été prises tôt le matin mais la météo est très agréable à cette période de l''année : il fait bon et sec et les nuits sont relativement fraîches. Je pense que le campus sera assez rapidement couvert de vert car les pousses chétives sont en effet de petits arbustes. Les alentours immédiats sont secs mais à 5 kilomètres environ c''est déjà la jungle (j''en ai atteint la lisière en courant mais la nuit tombait et j''ai été contraint de rentrer). Quand bien même on serait au milieu du Sahara, je suis à peu près sûr qu''ils arriveraient à tout couvrir d''arbres. L''énergie et l''argent investis dans l''institut sont assez impressionnants quand on voit la relative pauvreté des villages alentours. Ce sentiment est accentué par le fait que l''institut est aussi coupé du reste: il y a de gros générateurs électriques dans l''institut et des réservoir et chaines de tuyaux dont je devine qu''il servent stocker et retraiter
    l''eau. Et une armée de gens s''active dans les jardins pour les rendre plus présentables.


    Sur le fond, je n''ai pas encore grand chose à débriefer dans la mesure où je connais déjà une grande partie de ce qui est présenté. Les nouveautés sont la théorie de la "quantum measure" Raphael Sorkin et la "trace dynamics" présentée par Tejinder Singh (initialement introduite par Steven Adler et ses collaborateurs). Dans le premier cas, c''est une sorte d''extension de ce qu''on avait présenté en TD de mécanique quantique avec les interférences d''ordre supérieur. J''avoue que je suis assez sceptique. Il ne me semble pas tout à fait évident que la théorie soit cohérente. On trouve des corrections aux expériences interférométriques, c''est rigolo, mais à tout les coups ça détruit complètement le spectre de l''atome d''hydrogène ou permet d''envoyer de l''information plus vite que la lumière avec des paires intriquées. Les systèmes considérés sont tellement simples et le formalisme tellement embryonnaire qu''il est difficile de savoir. Pour la "trace dynamics" ça semble intéressant
    mais c''est nettement plus difficile et le cours est allé assez vite. C''est une théorie Hamiltonienne classique (déterministe) sur des champs de matrices à coefficients grassmaniens (le truc vachement intuitif...). L''idée est que quand on moyenne toutes les quantités sur l''ensemble canonique (le microcanonique doit marcher pareil), on retrouve les relations de commutation quantiques. Mieux (en théorie), en ajoutant les fluctuations, on ajoute une non-linéarité qui détruit les superpositions macroscopiques et résout le problème de la mesure. Je suis pour le moment incapable de vérifier ces affirmations moi même car j''ai à peine compris les définitions de base. Intuitivement, je vois mal comment une théorie classique donnée par un Lagrangien scalaire local, même si les champs sont à valeur dans un espace pourri, peut donner une théorie quantique non-locale (signe que j''ai probablement mal compris le schéma général). Je pense qu''il faudra que j''étudie directement le bouquin d''Adler.


    PS: Tu devrais ajouter ton nom à ton pseudo wordpress, d''aucuns pourraient penser que je m''écris à moi même.

    '
